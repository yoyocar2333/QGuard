[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qguard-eda"
version = "0.1.0"
description = "Reproducible robust crosstalk-aware scheduling for mapped quantum circuits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "QGuard contributors"}]
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
validation = ["qiskit>=2,<3", "qiskit-aer>=0.17,<0.18"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
qguard = "qguard.cli:main"

[project.urls]
Repository = "https://github.com/yoyocar2333/QGuard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
